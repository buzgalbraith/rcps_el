[project]
name = "rcps-el"
version = "0.1.0"
description = "Adapting methods for risk controlled prediction sets for grounding free text to biomedical ontologies."
readme = "README.md"
requires-python = "==3.10"
dependencies = [
    "gilda>=1.4.1",
    "indra>=1.24.0",
    "numpy>=1.26",
    "polars>=1.35.2",
    "pyobo>=0.12.12",
    "scipy>=1.11",
    "tqdm",
    "matplotlib",
    "datasets==4.8.5",
    "pystow>=0.8.19",
]

[project.optional-dependencies]
## fuzzyStringScore ##
fuzzy = ["rapidfuzz>=3.14.3"]
## sapbertScorer ##
sapbert = ["torch==2.11.0", "transformers==4.57.6"]
## llmScorer, uses LLMClients from DGLink ##
llm = [
    "dglink @ git+https://github.com/buzgalbraith/dglink.git@b3ee917",
    "ollama==0.6.2",
    "pydantic",
]
all = ["rcps-el[fuzzy,sapbert,llm]"]

[dependency-groups]
dev = ["black>=25.11.0", "ipdb>=0.13.13"]

[tool.uv]
build-constraint-dependencies = ["setuptools<70"]
